name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # unit tests (core), then the conformance suite against Neo4j Enterprise in a Testcontainer
      - name: Build and test
        run: mvn -B verify
      - name: Keep conformance outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-output
          path: rdf-snapshot-conformance/target/conformance-output/
          if-no-files-found: ignore
